name: SignalForge Hardened Services CI

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]
  
  workflow_dispatch:
    inputs:
      manual_service:
        description: 'Select a Microservice to manually compile & deploy:'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - gateway-microservice
          - order-microservice
          - payment-microservice
          - product-microservice
          - store-ui
          - user-microservice

permissions:
  id-token: write       
  contents: read        
  security-events: write 
  actions: read         

jobs:
  inspect_changes:
    name: Compute Change Delta
    runs-on: ubuntu-24.04
    outputs:
      active_matrix: ${{ steps.compute_targets.outputs.active_matrix }}
    steps:
      - name: Checkout Source Tree
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Evaluate Component Delta
        if: ${{ github.event_name != 'workflow_dispatch' }}
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            gateway-microservice: 'gateway-microservice/**'
            order-microservice: 'order-microservice/**'
            payment-microservice: 'payment-microservice/**'
            product-microservice: 'product-microservice/**'
            store-ui: 'store-ui/**'
            user-microservice: 'user-microservice/**'

      - name: Compute Execution Target Matrix Array
        id: compute_targets
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.manual_service }}" = "all" ]; then
              echo 'active_matrix=["gateway-microservice", "order-microservice", "payment-microservice", "product-microservice", "store-ui", "user-microservice"]' >> $GITHUB_OUTPUT
            else
              echo 'active_matrix=["${{ inputs.manual_service }}"]' >> $GITHUB_OUTPUT
            fi
          else
            echo "active_matrix=${{ steps.filter.outputs.changes }}" >> $GITHUB_OUTPUT
          fi

  build_and_secure:
    name: Secure Lifecycle
    needs: inspect_changes
    if: ${{ needs.inspect_changes.outputs.active_matrix != '[]' && needs.inspect_changes.outputs.active_matrix != '' }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.inspect_changes.outputs.active_matrix) }}
    uses: ./.github/workflows/.reusable-build-core.yml
    with:
      service_name: ${{ matrix.service }}
    secrets: inherit