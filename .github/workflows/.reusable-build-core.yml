name: .Reusable Build Core

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string

jobs:
  execute_pipeline_core:
    name: Build · Scan · Push — ${{ inputs.service_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
      security-events: write

    steps:
      - name: Hardened Repository Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: GitLeaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Automated Version Tag
        env:
          GH_REF_TYPE: ${{ github.ref_type }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
        run: |
          if [ "${GH_REF_TYPE}" = "tag" ]; then
            CLEAN_TAG=$(echo "${GH_REF_NAME}" | sed 's/[^a-zA-Z0-9_.-]/_/g')
            echo "VERSION_TAG=${CLEAN_TAG}" >> $GITHUB_ENV
          else
            echo "VERSION_TAG=build-${GH_SHA:0:7}" >> $GITHUB_ENV
          fi

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./${{ inputs.service_name }}/Dockerfile
          failure-threshold: warning

      - name: Set up Java 21
        if: ${{ inputs.service_name == 'order-microservice' }}
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js 20
        if: ${{ inputs.service_name == 'product-microservice' || inputs.service_name == 'gateway-microservice' || inputs.service_name == 'store-ui' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ inputs.service_name }}/package-lock.json

      - name: Compile and Test
        run: |
          case "${{ inputs.service_name }}" in

            user-microservice)
              echo "Running Python checks for ${{ inputs.service_name }}..."
              cd ${{ inputs.service_name }}
              pip install --break-system-packages -r requirements.txt
              if [ -d "tests" ] || [ -f "pytest.ini" ] || [ -f "pyproject.toml" ]; then
                pytest --tb=short
              else
                echo "No test suite found — skipping pytest"
              fi
              ;;

            store-ui|product-microservice|gateway-microservice)
              echo "Running Node.js checks for ${{ inputs.service_name }}..."
              cd ${{ inputs.service_name }}
              npm ci
              npm test
              ;;

            payment-microservice)
              echo "Running Go checks for ${{ inputs.service_name }}..."
              cd ${{ inputs.service_name }}
              go mod download
              go build ./...
              go test ./...
              ;;

            order-microservice)
              echo "Running Maven checks for ${{ inputs.service_name }}..."
              cd ${{ inputs.service_name }}
              mvn verify --batch-mode --no-transfer-progress
              ;;

          esac

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: OIDC Identity Federated Login to Microsoft Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate to Azure Container Registry
        run: az acr login --name ${{ secrets.AZURE_REGISTRY_NAME }}

      - name: Build Local Container Layer
        uses: docker/build-push-action@v6
        with:
          context: ./${{ inputs.service_name }}
          file: ./${{ inputs.service_name }}/Dockerfile
          load: true
          platforms: linux/amd64
          tags: ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io/${{ inputs.service_name }}:${{ env.VERSION_TAG }}
          cache-from: type=gha,scope=${{ inputs.service_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service_name }}

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'image'
          image-ref: ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io/${{ inputs.service_name }}:${{ env.VERSION_TAG }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Verified Image to ACR
        uses: docker/build-push-action@v6
        with:
          context: ./${{ inputs.service_name }}
          file: ./${{ inputs.service_name }}/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io/${{ inputs.service_name }}:${{ env.VERSION_TAG }}
            ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io/${{ inputs.service_name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.service_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service_name }}

      - name: Notify on Failure
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d parse_mode=Markdown \
            -d text="❌ *SignalForge Pipeline Failed*%0AService: *${{ inputs.service_name }}*%0ACommit: \`${{ github.sha }}\`%0A[View Failed Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"