name: SignalForge Hardened Services CI (GHCR)

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      manual_service:
        description: 'Select a Microservice to manually compile & deploy:'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - gateway-microservice
          - order-microservice
          - payment-microservice
          - product-microservice
          - store-ui
          - user-microservice

permissions:
  id-token: write
  contents: read
  security-events: write
  actions: read
  packages: write

jobs:
  inspect_changes:
    name: Compute Change Delta
    runs-on: ubuntu-24.04
    outputs:
      active_matrix: ${{ steps.compute_targets.outputs.active_matrix }}
    steps:
      - name: Hardened Repository Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Evaluate Component Delta
        if: ${{ github.event_name != 'workflow_dispatch' }}
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            gateway-microservice:
              - 'gateway-microservice/**'
            order-microservice:
              - 'order-microservice/**'
            payment-microservice:
              - 'payment-microservice/**'
            product-microservice:
              - 'product-microservice/**'
            store-ui:
              - 'store-ui/**'
            user-microservice:
              - 'user-microservice/**'

      - name: Compute Execution Target Matrix Array
        id: compute_targets
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.manual_service }}" = "all" ]; then
              echo 'active_matrix=["gateway-microservice", "order-microservice", "payment-microservice", "product-microservice", "store-ui", "user-microservice"]' >> $GITHUB_OUTPUT
            else
              echo 'active_matrix=["${{ inputs.manual_service }}"]' >> $GITHUB_OUTPUT
            fi
          else
            echo "active_matrix=${{ steps.filter.outputs.changes }}" >> $GITHUB_OUTPUT
          fi

  # Instead of using a matrix inside a reusable workflow (which causes the startup crash),
  # we run a standard matrix job that runs a local build and push sequence.
  build_and_push_uat:
    name: Build & Push — ${{ matrix.service }}
    needs: inspect_changes
    if: ${{ needs.inspect_changes.outputs.active_matrix != '[]' && needs.inspect_changes.outputs.active_matrix != '' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.inspect_changes.outputs.active_matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:uat
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:uat-${{ github.sha }}