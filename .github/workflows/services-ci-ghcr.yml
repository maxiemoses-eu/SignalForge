name: SignalForge Hardened Services CI (GHCR)

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      manual_service:
        description: 'Select a Microservice to manually compile & deploy:'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - gateway-microservice
          - order-microservice
          - payment-microservice
          - product-microservice
          - store-ui
          - user-microservice

permissions:
  id-token: write
  contents: read
  security-events: write
  actions: read
  packages: write

jobs:
  inspect_changes:
    name: Compute Change Delta
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      active_matrix: ${{ steps.compute_targets.outputs.active_matrix }}
    steps:
      - name: Hardened Repository Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      # Skipped for manual runs and tag pushes (tags build everything).
      - name: Evaluate Component Delta
        if: ${{ github.event_name != 'workflow_dispatch' && github.ref_type != 'tag' }}
        id: filter
        uses: dorny/paths-filter@v3.0.2
        with:
          filters: |
            gateway-microservice:
              - 'gateway-microservice/**'
            order-microservice:
              - 'order-microservice/**'
            payment-microservice:
              - 'payment-microservice/**'
            product-microservice:
              - 'product-microservice/**'
            store-ui:
              - 'store-ui/**'
            user-microservice:
              - 'user-microservice/**'

      - name: Compute Execution Target Matrix Array
        id: compute_targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          MANUAL_SERVICE: ${{ inputs.manual_service }}
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          ALL='["gateway-microservice","order-microservice","payment-microservice","product-microservice","store-ui","user-microservice"]'

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${MANUAL_SERVICE}" = "all" ]; then
              MATRIX="${ALL}"
            else
              MATRIX="[\"${MANUAL_SERVICE}\"]"
            fi
          elif [ "${REF_TYPE}" = "tag" ]; then
            MATRIX="${ALL}"
          else
            MATRIX="${CHANGES:-[]}"
          fi

          echo "Active matrix: ${MATRIX}"
          echo "active_matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  build_and_secure:
    name: Secure Lifecycle — ${{ matrix.service }}
    needs: inspect_changes
    if: ${{ needs.inspect_changes.outputs.active_matrix != '[]' && needs.inspect_changes.outputs.active_matrix != '' }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.inspect_changes.outputs.active_matrix) }}
    uses: ./.github/workflows/.reusable-build-core-ghcr.yml
    with:
      service_name: ${{ matrix.service }}
    secrets: inherit