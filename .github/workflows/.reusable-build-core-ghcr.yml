name: .Reusable Build Core

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false
      AZURE_REGISTRY_NAME:
        required: false
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false

jobs:
  execute_pipeline_core:
    name: Build · Scan · Push — ${{ inputs.service_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
      security-events: write
      packages: write
    env:
      # The `secrets` context is not allowed in step-level `if:`,
      # so resolve it once here and check env.HAS_AZURE in steps.
      HAS_AZURE: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' && secrets.AZURE_REGISTRY_NAME != '' }}

    steps:
      - name: Hardened Repository Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: GitLeaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Automated Version Tag
        env:
          GH_REF_TYPE: ${{ github.ref_type }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
        run: |
          if [ "${GH_REF_TYPE}" = "tag" ]; then
            CLEAN_TAG=$(echo "${GH_REF_NAME}" | sed 's/[^a-zA-Z0-9_.-]/_/g' | tr '[:upper:]' '[:lower:]')
            echo "VERSION_TAG=${CLEAN_TAG}" >> $GITHUB_ENV
          else
            echo "VERSION_TAG=build-${GH_SHA:0:7}" >> $GITHUB_ENV
          fi
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "${{ inputs.service_name }}/Dockerfile"
          failure-threshold: warning

      - name: Set up Java 21
        if: ${{ inputs.service_name == 'order-microservice' }}
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js 22
        if: ${{ inputs.service_name == 'product-microservice' || inputs.service_name == 'gateway-microservice' || inputs.service_name == 'store-ui' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: ${{ inputs.service_name }}/package-lock.json

      - name: Compile and Test
        env:
          SERVICE: ${{ inputs.service_name }}
        run: |
          case "${SERVICE}" in
            user-microservice)
              cd "${SERVICE}"
              pip install --break-system-packages -r requirements.txt
              # Exit code 5 = no tests collected (allowed). Any other failure fails the job.
              pytest --tb=short || [ $? -eq 5 ]
              ;;
            store-ui|product-microservice|gateway-microservice)
              cd "${SERVICE}"
              npm ci && npm test
              ;;
            payment-microservice)
              cd "${SERVICE}"
              go mod download && go build ./... && go test ./...
              ;;
            order-microservice)
              cd "${SERVICE}"
              mvn verify --batch-mode --no-transfer-progress
              ;;
            *)
              echo "Unknown service: ${SERVICE}"
              exit 1
              ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      # No registry logins on pull requests: they never push, and fork PRs can't authenticate.
      - name: Log in to GitHub Container Registry (GHCR)
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: OIDC Identity Federated Login to Microsoft Azure
        if: ${{ env.HAS_AZURE == 'true' && github.event_name != 'pull_request' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate to Azure Container Registry
        if: ${{ env.HAS_AZURE == 'true' && github.event_name != 'pull_request' }}
        env:
          AZURE_REGISTRY_NAME: ${{ secrets.AZURE_REGISTRY_NAME }}
        run: az acr login --name "${AZURE_REGISTRY_NAME}"

      - name: Build Local Container Layer
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: ./${{ inputs.service_name }}
          file: ./${{ inputs.service_name }}/Dockerfile
          load: true
          platforms: linux/amd64
          tags: ghcr.io/${{ env.REPO_LOWER }}/${{ inputs.service_name }}:${{ env.VERSION_TAG }}
          cache-from: type=gha,scope=${{ inputs.service_name }}

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'image'
          image-ref: ghcr.io/${{ env.REPO_LOWER }}/${{ inputs.service_name }}:${{ env.VERSION_TAG }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Compute Image Tags
        if: ${{ github.event_name != 'pull_request' }}
        id: tags
        env:
          SERVICE: ${{ inputs.service_name }}
          GH_SHA: ${{ github.sha }}
          AZURE_REGISTRY_NAME: ${{ secrets.AZURE_REGISTRY_NAME }}
        run: |
          {
            echo "list<<TAGS_EOF"
            echo "ghcr.io/${REPO_LOWER}/${SERVICE}:${VERSION_TAG}"
            echo "ghcr.io/${REPO_LOWER}/${SERVICE}:sha-${GH_SHA}"
            if [ "${HAS_AZURE}" = "true" ]; then
              echo "${AZURE_REGISTRY_NAME}.azurecr.io/${SERVICE}:${VERSION_TAG}"
              echo "${AZURE_REGISTRY_NAME}.azurecr.io/${SERVICE}:sha-${GH_SHA}"
            fi
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Push Verified Image to GHCR (and ACR if configured)
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: ./${{ inputs.service_name }}
          file: ./${{ inputs.service_name }}/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=${{ inputs.service_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service_name }}

      - name: Notify on Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERVICE: ${{ inputs.service_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode=Markdown \
            -d text="❌ *SignalForge Pipeline Failed*%0AService: *${SERVICE}*%0ACommit: \`${GITHUB_SHA}\`%0A[View Failed Run](${RUN_URL})"