name: .Reusable Build Core (GHCR)

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string

jobs:
  execute_pipeline_core:
    name: Build · Scan · Push — ${{ inputs.service_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
      security-events: write
      packages: write

    steps:
      - name: Hardened Repository Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: GitLeaks Secret Scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Automated Version Tag
        env:
          GH_REF_TYPE: ${{ github.ref_type }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
        run: |
          if [ "${GH_REF_TYPE}" = "tag" ]; then
            CLEAN_TAG=$(echo "${GH_REF_NAME}" | sed 's/[^a-zA-Z0-9_.-]/_/g')
            echo "VERSION_TAG=${CLEAN_TAG}" >> $GITHUB_ENV
          else
            echo "VERSION_TAG=build-${GH_SHA:0:7}" >> $GITHUB_ENV
          fi

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: ./${{ inputs.service_name }}/Dockerfile
          failure-threshold: warning

      - name: Set up Java 21
        if: ${{ inputs.service_name == 'order-microservice' }}
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js 20
        if: ${{ inputs.service_name == 'product-microservice' || inputs.service_name == 'gateway-microservice' || inputs.service_name == 'store-ui' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ inputs.service_name }}/package-lock.json

      - name: Compile and Test
        run: |
          case "${{ inputs.service_name }}" in

            user-microservice)
              echo "Running Python checks for ${{ inputs.service_name }}..."
              cd ${{ inputs.service_name }}
              pip install --break-system-packages -r requirements.txt
              if [ -d "tests" ] || [ -f "pytest.ini" ] || [ -f "pyproject.toml" ]; then
                pytest --tb=short
              else
                echo "No test suite found — skipping pytest"
              fi
              ;;

            store-ui|product-microservice|gateway-microservice)
              echo "Running Node.js checks for ${{ inputs.service_name }}..."
              cd ${{ inputs.service_name }}
              npm ci
              npm test
              ;;

            payment-microservice)
              echo "Running Go checks for ${{ inputs.service_name }}..."
              cd ${{ inputs.service_name }}
              go mod download
              go build ./...
              go test ./...
              ;;

            order-microservice)
              echo "Running Maven checks for ${{ inputs.service_name }}..."
              cd ${{ inputs.service_name }}
              mvn verify --batch-mode --no-transfer-progress
              ;;

          esac

      - name: Set up QEMU
        uses: docker/setup-qemu-action@68827325e0b33c7199eb31dd4e31fbe9023e06e3 # v3.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db14fdd7910d21350268e4de0e75d5c2d66ee # v3.0.0

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Local Container Layer
        uses: docker/build-push-action@2cdde22fde133043114e72c1d5a6a018ac93433a # v5.3.0
        with:
          context: .
          file: ./${{ inputs.service_name }}/Dockerfile
          load: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner | lower }}/${{ inputs.service_name }}:${{ env.VERSION_TAG }}
          cache-from: type=gha,scope=${{ inputs.service_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service_name }}

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@18f2510ee396bbf400e26442d6d451fe4fad3a20 # v0.35.0 safe post-CVE-2026-33634
        with:
          scan-type: 'image'
          image-ref: ghcr.io/${{ github.repository_owner | lower }}/${{ inputs.service_name }}:${{ env.VERSION_TAG }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Verified Image to GHCR
        uses: docker/build-push-action@2cdde22fde133043114e72c1d5a6a018ac93433a # v5.3.0
        with:
          context: .
          file: ./${{ inputs.service_name }}/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner | lower }}/${{ inputs.service_name }}:${{ env.VERSION_TAG }}
            ghcr.io/${{ github.repository_owner | lower }}/${{ inputs.service_name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.service_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service_name }}

      - name: Notify on Failure
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d parse_mode=Markdown \
            -d text="❌ *SignalForge Pipeline Failed*%0AService: *${{ inputs.service_name }}*%0ACommit: \`${{ github.sha }}\`%0A[View Failed Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"